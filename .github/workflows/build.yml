name: Build APK

on:
  push:
    branches:
      - feat/ech-h3-applayer
      - feat/geckoview
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an APK release after building
        required: false
        default: false
        type: boolean
      apk_upload_id:
        description: 'Resume a 24-hour Oracle upload session for the exact same APK SHA-256'
        required: false
        type: string

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Unix gradlew (only gradlew.bat), so Gradle is
      # installed by the action instead of running a wrapper script.
      # AGP 8.9.1 needs Gradle 8.11+ (GeckoView 151 forces AGP 8.9.1+).
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The repo gitignores google-services.json (upstream never shipped
      # one), and the google-services plugin fails without it. Write a
      # dummy placeholder at build time only — never commit it, so a real
      # config can never leak through this file by accident.
      - name: Write placeholder google-services.json
        run: |
          cat > app/google-services.json <<'EOF'
          {"client":[{"api_key":[{"current_key":"AIzaSyPlaceholderPlaceholderPlaceholder00"}],"client_info":{"android_client_info":{"package_name":"com.example.javbrowser"},"mobilesdk_app_id":"1:000000000000:android:0000000000000000"},"oauth_client":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"api_key":[{"current_key":"AIzaSyPlaceholderPlaceholderPlaceholder00"}],"client_info":{"android_client_info":{"package_name":"com.example.javbrowser.ech"},"mobilesdk_app_id":"1:000000000000:android:0000000000000001"},"oauth_client":[],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1","project_info":{"project_id":"javbrowser-placeholder","project_number":"000000000000","storage_bucket":"javbrowser-placeholder.appspot.com"}}
          EOF

      # The full legacy test suite currently has an unrelated failing local-video test.
      - name: Test landing URL mapping and build debug APK
        run: gradle testDebugUnitTest --tests com.example.javbrowser.LandingUrlMapperTest assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: javbrowser-debug
          # Split APK 名隨 AGP 而異（app-debug-arm64-v8a.apk 等），用 glob
          # 抓實際產出；if-no-files-found 用 error，缺 APK 就直接失敗，
          # 別只警告然後讓 release 找不到 artifact。
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Submit APK to Oracle smoke test
        id: oracle_smoke
        if: github.ref == 'refs/heads/feat/geckoview'
        env:
          APK_TEST_API_TOKEN: ${{ secrets.APK_TEST_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.APK_TEST_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.APK_TEST_CF_ACCESS_CLIENT_SECRET }}
          APK_UPLOAD_ID: ${{ github.event.inputs.apk_upload_id }}
        run: bash scripts/oracle-apk-smoke.sh

      - name: Upload Oracle smoke-test evidence
        if: always() && github.ref == 'refs/heads/feat/geckoview'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/apk-test-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the build if Oracle smoke test did not pass
        if: always() && github.ref == 'refs/heads/feat/geckoview'
        env:
          ORACLE_TEST_RESULT: ${{ steps.oracle_smoke.outputs.result }}
        run: |
          if [[ "$ORACLE_TEST_RESULT" != 'passed' ]]; then
            echo "::error::Oracle smoke test result: ${ORACLE_TEST_RESULT:-missing}"
            exit 1
          fi



  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: javbrowser-debug
          path: apks

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 分片 APK 名随 AGP 而异，统一名为 app-debug-arm64.apk，
          # 与交付镜像 URL 口径一致。
          APK_FILE=$(ls apks/*.apk | head -n 1)
          if [ "$APK_FILE" != "apks/app-debug-arm64.apk" ]; then
            mv "$APK_FILE" apks/app-debug-arm64.apk
          fi
          ls -la apks/
          TAG="build-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"
          gh release create "$TAG" apks/app-debug-arm64.apk \
            --title "构建版 $TAG" \
            --notes "feat/geckoview 自动构建：$SUBJECT" \
            --target "$GITHUB_SHA"
