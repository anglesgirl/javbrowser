<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { 
            background-color: #121212; 
            color: white; 
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 14px 18px;
        }
        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 2px 14px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: .2px;
        }
        .search-container {
            width: 100%;
            margin-bottom: 12px;
        }
        .search-box {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            font-size: 16px;
            border: 2px solid #BB86FC;
            border-radius: 12px;
            background-color: #1E1E1E;
            color: white;
        }
        .search-box:focus {
            outline: none;
            border-color: #CF6FFF;
        }
        .search-results {
            width: 100%;
            display: none;
            box-sizing: border-box;
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            background: #1b1b1b;
            border: 1px solid #38313f;
        }
        .search-results.show {
            display: block;
        }
        .search-results > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 40px;
            width: 100%;
            cursor: pointer;
            list-style: none;
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
        }
        .search-results > summary::-webkit-details-marker { display: none; }
        .search-results > summary::after { content: '+'; color: #BB86FC; font-size: 22px; flex-shrink: 0; }
        .search-results[open] > summary::after { content: '−'; }
        .search-query-hint {
            margin: 4px 0 12px;
            font-size: 12px;
            color: #a9a2b1;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }
        .search-site-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .search-results:not([open]) > .search-site-grid,
        .search-results:not([open]) > .search-query-hint { display: none; }
        a {
            text-decoration: none;
        }
        .search-results a,
        .site-grid a {
            display: flex;
            min-height: 44px;
            padding: 8px 9px;
            align-items: center;
            justify-content: center;
            background-color: #BB86FC; 
            color: black; 
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }
        .search-results a:active,
        .site-grid a:active {
            background-color: #CF6FFF;
        }
        .search-site-grid a {
            box-sizing: border-box;
            min-width: 0;
            min-height: 48px;
            padding: 10px 8px;
            color: #24152B;
            overflow-wrap: anywhere;
        }
        .search-site-grid a:focus-visible { outline: 2px solid white; outline-offset: 2px; }
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 0 0 14px;
        }
        .quick-grid a {
            display: flex;
            min-height: 54px;
            padding: 9px;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.25;
            text-align: center;
        }
        .divider {
            width: 100%;
            margin: 6px 2px 8px;
            color: #aaa;
            font-size: 13px;
            font-weight: 700;
        }
        .site-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        #playback-history-link {
            display: block; width: 100%; box-sizing: border-box; margin-top: 14px;
            padding: 16px; min-height: 54px; border-radius: 12px; background: #776014;
            color: #FFF4C4; font-size: 16px; font-weight: 800; text-align: center;
        }
        #playback-history-link:active { background: #967B22; }
        .help-button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #666;
        }
        #jav-hint { margin-top: 8px !important; }
        #clipboard-link { margin: 0 0 14px; padding: 14px; border: 1px solid #BB86FC; border-radius: 12px; background: #251b32; }
        #clipboard-link[hidden] { display: none; }
        #clipboard-link p { margin: 6px 0 12px; }
        #clipboard-link-url { display: block; color: #ccc; font-size: 13px; overflow-wrap: anywhere; margin-bottom: 12px; }
        .clipboard-actions { display: flex; gap: 8px; }
        .clipboard-actions button { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; font-weight: bold; }
        #clipboard-link-open { background: #BB86FC; color: #24152B; }
        #clipboard-link-dismiss { background: #3b3345; color: #fff; }
        #btn-save-jav {
            min-height: 44px;
            padding: 8px 12px !important;
            border-radius: 10px !important;
            font-size: 14px !important;
        }
        .ad-wrap {
            position: relative;
            margin-top: 14px;
        }
        .ad-card {
            display: flex;
            min-height: 58px;
            padding: 10px 46px 10px 12px;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: linear-gradient(135deg, #586bd8 0%, #7447a8 100%);
            border-radius: 12px;
            color: white;
            box-shadow: 0 3px 10px rgba(0,0,0,.25);
        }
        .ad-main { font-size: 13px; font-weight: 800; line-height: 1.25; }
        .ad-action { flex: 0 0 auto; font-size: 12px; opacity: .9; }
        .ad-toggle {
            position: absolute;
            top: 9px;
            right: 8px;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: rgba(0,0,0,.25);
            color: #fff;
            font-size: 18px;
        }
        .ad-wrap.collapsed .ad-card { min-height: 42px; padding-top: 7px; padding-bottom: 7px; }
        .ad-wrap.collapsed .ad-action { display: none; }
        @media (min-width: 620px) {
            .site-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .search-site-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
    </style>
</head>
